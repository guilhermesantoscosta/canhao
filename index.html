<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<title>Parábola 3D — Acerte o Buraco</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#080d1a;color:#e8eefc;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
.panel{position:absolute;background:rgba(14,21,38,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(120,170,255,.18);border-radius:16px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.5);font-size:13px;z-index:10}
.panel h1{margin:0 0 4px;font-size:16px}
.sub{margin:0 0 14px;font-size:11.5px;color:#8ea3c9;line-height:1.45}
#controls{top:14px;left:14px;width:250px}
#math{top:14px;right:14px;width:270px;transition:transform .28s,opacity .28s}
.sr{margin-bottom:14px}
.rt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rt label{font-weight:700;font-size:16px;font-style:italic}
.val{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;background:rgba(255,255,255,.07);padding:2px 9px;border-radius:7px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:#25334f;outline:none;cursor:pointer;touch-action:manipulation}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid #0b1020;box-shadow:0 0 10px currentColor;background:currentColor}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:2px solid #0b1020;background:currentColor}
input:disabled{opacity:.4}
.sa{color:#ff6b9d}.sb{color:#6fa8ff}.sc{color:#4ade80}
.buttons{display:flex;gap:8px;margin-top:14px}
button{flex:1;padding:10px 8px;border-radius:10px;border:1px solid rgba(120,170,255,.28);background:linear-gradient(180deg,#1d2c4c,#152039);color:#dbe7ff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;touch-action:manipulation}
button:hover:not(:disabled){border-color:rgba(120,170,255,.6)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4}
button.primary{background:linear-gradient(180deg,#2f6bff,#1d4fd8);border-color:#4b82ff;color:#fff;box-shadow:0 4px 14px rgba(47,107,255,.4)}
button.small{flex:0 0 46px;font-size:16px;padding:10px 4px}
#eq{font-size:15px;font-weight:700;text-align:center;padding:9px 4px;margin-bottom:10px;background:rgba(111,168,255,.1);border:1px solid rgba(111,168,255,.22);border-radius:10px;font-variant-numeric:tabular-nums}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px}
.mrow span{color:#8ea3c9}.mrow b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
#concav{margin-top:10px;padding:8px 10px;border-radius:9px;font-size:11.5px;text-align:center;font-weight:600}
#concav.ok{background:rgba(74,222,128,.12);color:#7ef0a8;border:1px solid rgba(74,222,128,.3)}
#concav.bad{background:rgba(255,107,157,.12);color:#ff9bbd;border:1px solid rgba(255,107,157,.3)}
#stats{position:absolute;bottom:14px;left:14px;display:flex;gap:10px;z-index:10}
.stat{background:rgba(14,21,38,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(120,170,255,.18);border-radius:12px;padding:8px 14px;text-align:center}
.stat .n{font-size:19px;font-weight:800;color:#7fb2ff;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:9.5px;color:#8ea3c9;text-transform:uppercase;letter-spacing:.7px}
#toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(14,21,38,.94);border-radius:13px;padding:13px 22px;font-size:13.5px;line-height:1.5;max-width:min(560px,86vw);text-align:center;opacity:0;pointer-events:none;transition:.28s;z-index:20;border:1px solid rgba(120,170,255,.2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(48,227,202,.55);box-shadow:0 0 32px rgba(48,227,202,.28)}
#toast.bad{border-color:rgba(255,107,157,.45);box-shadow:0 0 32px rgba(255,107,157,.18)}
#toast b{color:#fff}
#hintKeys{position:absolute;bottom:16px;right:16px;font-size:11px;color:#5d729b;z-index:10}
kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;font-size:10.5px;font-family:inherit}
#btnMath{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:48px;height:48px;border-radius:14px;padding:0;flex:none;font-size:22px;z-index:25;align-items:center;justify-content:center;background:rgba(14,21,38,.9)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080d1a;z-index:50;font-size:14px;color:#8ea3c9;transition:opacity .4s}

@media (max-width:820px),(max-height:520px){
  #btnMath{display:flex}
  #controls{top:auto;bottom:0;left:0;right:0;width:100%;border-radius:20px 20px 0 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-width:1px 0 0}
  #controls h1,#controls .sub{display:none}
  .sr{display:grid;grid-template-columns:26px 1fr 64px;align-items:center;gap:12px;margin-bottom:10px}
  .rt{display:contents}.rt label{font-size:19px;margin:0}.val{text-align:right;padding:3px 6px}
  input[type=range]{height:8px}
  input[type=range]::-webkit-slider-thumb{width:30px;height:30px;border-width:3px}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-width:3px}
  .buttons{margin-top:10px;gap:10px}
  button{min-height:52px;font-size:15px;border-radius:12px}
  button.small{flex:0 0 56px;font-size:20px}
  #math{top:calc(12px + env(safe-area-inset-top));right:calc(72px + env(safe-area-inset-right));left:calc(12px + env(safe-area-inset-left));width:auto;max-height:calc(100vh - 200px);overflow-y:auto;transform:translateY(-130%);opacity:0;pointer-events:none}
  #math.show{transform:none;opacity:1;pointer-events:auto}
  #stats{top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));bottom:auto;gap:6px}
  .stat{padding:5px 9px;border-radius:10px}.stat .n{font-size:15px}.stat .l{font-size:8px}
  #toast{bottom:calc(215px + env(safe-area-inset-bottom));font-size:12.5px;padding:10px 16px;max-width:92vw}
  #hintKeys{display:none}
}
@media (max-height:520px) and (orientation:landscape){
  #controls{width:320px;top:0;bottom:0;left:auto;right:0;border-radius:20px 0 0 20px;display:flex;flex-direction:column;justify-content:center;border-width:0 0 0 1px}
  #stats{flex-direction:column}
  #math{right:calc(336px + env(safe-area-inset-right));max-height:calc(100vh - 24px)}
  #toast{bottom:24px}
}
</style>
</head>
<body>
<div id="loading">Carregando…</div>
<button id="btnMath" aria-label="Informações matemáticas">📊</button>

<div class="panel" id="controls">
  <h1>🕳️ Parábola 3D</h1>
  <p class="sub">Ajuste a, b e c, desvie das barreiras e acerte o buraco.</p>
  <div class="sr sa"><div class="rt"><label for="sA">a</label><span class="val" id="vA"></span></div><input id="sA" type="range" min="-0.40" max="0.10" step="0.005" value="-0.08"></div>
  <div class="sr sb"><div class="rt"><label for="sB">b</label><span class="val" id="vB"></span></div><input id="sB" type="range" min="-2" max="3" step="0.05" value="1.2"></div>
  <div class="sr sc"><div class="rt"><label for="sC">c</label><span class="val" id="vC"></span></div><input id="sC" type="range" min="0" max="6" step="0.1" value="0.5"></div>
  <div class="buttons">
    <button class="primary" id="btnLaunch">🚀 Lançar</button>
    <button class="small" id="btnReset" title="Reiniciar">↺</button>
    <button class="small" id="btnTarget" title="Novo alvo">🎯</button>
  </div>
</div>

<div class="panel" id="math">
  <div id="eq"></div>
  <div class="mrow"><span>Δ = b² − 4ac</span><b id="delta">—</b></div>
  <div class="mrow"><span>Vértice</span><b id="vertex">—</b></div>
  <div class="mrow"><span>Raízes (y = 0)</span><b id="roots">—</b></div>
  <div class="mrow"><span>Altura máxima</span><b id="ymax">—</b></div>
  <div id="concav" class="ok"></div>
</div>

<div id="stats">
  <div class="stat"><div class="n" id="score">0</div><div class="l">Acertos</div></div>
  <div class="stat"><div class="n" id="attempts">0</div><div class="l">Lançamentos</div></div>
  <div class="stat"><div class="n" id="tgt">15,0 m</div><div class="l">Buraco (x)</div></div>
  <div class="stat"><div class="n" id="nbar">1</div><div class="l">Barreiras</div></div>
</div>
<div id="toast"></div>
<div id="hintKeys"><kbd>Espaço</kbd> lançar · <kbd>R</kbd> reiniciar · <kbd>M</kbd> matemática · arraste para girar</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const nf = (n, d = 2) => n.toFixed(d).replace('.', ',');
const mq = () => matchMedia('(max-width:820px),(max-height:520px)').matches;
const MOB = mq();
const CFG = { maxX: 42, speedX: 4.5, ballR: 0.42, holeR: 1.05, trailMax: 220, field: 60 };
const S = { a: -0.08, b: 1.2, c: 0.5, phase: 'aim', t: 0, score: 0, attempts: 0, targetX: 15, sinkT: 0 };
const f = x => S.a * x * x + S.b * x + S.c;

/* ═════ Renderer ═════ */
const renderer = new THREE.WebGLRenderer({ antialias: !MOB, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOB ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = MOB ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 8;
controls.maxDistance = 90;

let camMode = '';
function modeKey() { return mq() ? (innerHeight > innerWidth ? 'mp' : 'ml') : (innerWidth / innerHeight < 1.3 ? 'tab' : 'desk'); }
function adjustCamera() {
  camMode = modeKey();
  const P = {
    mp:   [62, [10, 19, 46], [14, 5, 0]],
    ml:   [58, [6, 15, 40],  [13, 4.5, 0]],
    tab:  [54, [5, 14, 36],  [12, 4, 0]],
    desk: [48, [4, 12, 32],  [12, 3.5, 0]]
  }[camMode];
  camera.fov = P[0];
  camera.position.set(...P[1]);
  controls.target.set(...P[2]);
  camera.updateProjectionMatrix();
  controls.update();
}
adjustCamera();

/* ═════ Céu, névoa, luzes ═════ */
(function sky() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#1a5ac4'); gr.addColorStop(.45, '#6fb0ee'); gr.addColorStop(.8, '#b9e0d0'); gr.addColorStop(1, '#c9e4b0');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
})();
scene.fog = new THREE.Fog(0xbfe0b0, 80, 230);
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x3a5a2e, 0.95));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.5);
sun.position.set(-25, 38, 28);
sun.castShadow = true;
const sm = MOB ? 1024 : 2048;
sun.shadow.mapSize.set(sm, sm);
Object.assign(sun.shadow.camera, { near: 1, far: 140, left: -50, right: 50, top: 50, bottom: -50 });
sun.shadow.bias = -0.0008;
sun.target.position.set(14, 0, 0);
scene.add(sun, sun.target);

/* ═════ Campo ═════ */
(function field() {
  const size = MOB ? 1024 : 2048, c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d'), mid = size / 2, ppu = mid / CFG.field;
  g.fillStyle = '#1e4a24'; g.fillRect(0, 0, size, size);
  for (let i = CFG.field; i >= 1; i--) { g.beginPath(); g.arc(mid, mid, i * ppu, 0, 7); g.fillStyle = i % 2 ? '#1f5026' : '#2e6a35'; g.fill(); }
  g.strokeStyle = 'rgba(220,245,220,.2)'; g.lineWidth = size / 1024;
  for (let a = 0; a < 360; a += 15) { const r = a * Math.PI / 180; g.beginPath(); g.moveTo(mid, mid); g.lineTo(mid + Math.cos(r) * mid, mid + Math.sin(r) * mid); g.stroke(); }
  for (let i = 5; i <= CFG.field; i += 5) { g.strokeStyle = 'rgba(240,255,240,.5)'; g.lineWidth = size / 512; g.beginPath(); g.arc(mid, mid, i * ppu, 0, 7); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.65)'; g.lineWidth = size / 300; g.beginPath(); g.arc(mid, mid, mid - 2, 0, 7); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const m = new THREE.Mesh(new THREE.CircleGeometry(CFG.field, MOB ? 64 : 128), new THREE.MeshStandardMaterial({ map: t, roughness: 1 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.02; m.receiveShadow = true; scene.add(m);
  const o = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshStandardMaterial({ color: 0x2d5c2f, roughness: 1 }));
  o.rotation.x = -Math.PI / 2; o.position.y = -0.05; scene.add(o);
})();

/* Árvores (instanciadas = 2 draw calls) */
(function trees() {
  const N = MOB ? 45 : 90;
  const cone = new THREE.InstancedMesh(new THREE.ConeGeometry(1.7, 5.5, 7), new THREE.MeshStandardMaterial({ roughness: .9 }), N);
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.25, .35, 1.6, 6), new THREE.MeshStandardMaterial({ color: 0x5a3b22, roughness: 1 }), N);
  const d = new THREE.Object3D(), col = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const ang = Math.random() * 6.283, r = 40 + Math.random() * 18, k = .8 + Math.random() * .8;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
    if (Math.abs(z) < 10 && x > -6 && x < 46) { i--; continue; }
    d.position.set(x, 1.6 * k + 2.2 * k, z); d.scale.setScalar(k); d.updateMatrix(); cone.setMatrixAt(i, d.matrix);
    col.setHSL(.3 + Math.random() * .06, .5, .2 + Math.random() * .08); cone.setColorAt(i, col);
    d.position.y = .8 * k; d.updateMatrix(); trunk.setMatrixAt(i, d.matrix);
  }
  cone.castShadow = !MOB; scene.add(cone, trunk);
})();

/* Nuvens */
const clouds = [];
(function mkClouds() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, fog: false, opacity: .8 });
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Sprite(mat); const w = 22 + Math.random() * 20;
    s.scale.set(w, w * .38, 1); s.position.set(-90 + Math.random() * 200, 34 + Math.random() * 22, -50 - Math.random() * 90);
    s.userData.v = .4 + Math.random() * .6; scene.add(s); clouds.push(s);
  }
})();

/* ═════ Canhão ═════ */
const mDark = new THREE.MeshStandardMaterial({ color: 0x2c3d5e, metalness: .5, roughness: .55 });
const mMetal = new THREE.MeshStandardMaterial({ color: 0x9aabc8, metalness: .85, roughness: .28 });
const mAcc = new THREE.MeshStandardMaterial({ color: 0x6fa8ff, emissive: 0x2a4b8a, emissiveIntensity: .8, metalness: .5, roughness: .3 });
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(.32, .5, 1, 18), mDark);
const pivot = new THREE.Mesh(new THREE.SphereGeometry(.32, 16, 12), mAcc);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.22, .3, 1.8, 20), mMetal);
const muzzle = new THREE.Mesh(new THREE.TorusGeometry(.24, .045, 8, 20), mAcc);
[pedestal, pivot, barrel].forEach(m => m.castShadow = true);
scene.add(pedestal, pivot, barrel, muzzle);
function updateLauncher() {
  const h = Math.max(S.c, .2), th = Math.atan(S.b), dir = new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
  pedestal.scale.set(1, h, 1); pedestal.position.set(0, h / 2, 0); pivot.position.set(0, S.c, 0);
  barrel.rotation.z = th - Math.PI / 2; barrel.position.set(0, S.c, 0).addScaledVector(dir, .9);
  muzzle.position.set(0, S.c, 0).addScaledVector(dir, 1.8); muzzle.rotation.set(0, Math.PI / 2, th);
}

/* ═════ Bola com brilho ═════ */
const ball = new THREE.Mesh(new THREE.SphereGeometry(CFG.ballR, 24, 18),
  new THREE.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffaa22, emissiveIntensity: 1.2, roughness: .25, metalness: .15 }));
ball.castShadow = true; scene.add(ball);
(function glow() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,200,80,.9)'); gr.addColorStop(1, 'rgba(255,160,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));
  s.scale.setScalar(2.6); ball.add(s);
})();

/* Rastro */
const trailGeo = new THREE.SphereGeometry(.13, 8, 6);
const trailMat = new THREE.MeshBasicMaterial({ color: 0xffc233, transparent: true, opacity: .9 });
const trail = []; let th = 0;
for (let i = 0; i < CFG.trailMax; i++) { const m = new THREE.Mesh(trailGeo, trailMat); m.visible = false; m.frustumCulled = false; scene.add(m); trail.push(m); }
function pushTrail(x, y) {
  const l = trail[(th - 1 + CFG.trailMax) % CFG.trailMax];
  if (l.visible && (x - l.position.x) ** 2 + (y - l.position.y) ** 2 < .0081) return;
  trail[th].position.set(x, y, 0); trail[th].visible = true; th = (th + 1) % CFG.trailMax;
}
function clearTrail() { trail.forEach(m => m.visible = false); th = 0; }

/* Partículas */
const PN = 64, pPos = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ size: .4, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: 0xffffff });
const pts = new THREE.Points(pGeo, pMat); pts.frustumCulled = false; scene.add(pts);
pPos.fill(-100);
function burst(x, y, color) {
  pMat.color.setHex(color);
  for (let i = 0; i < PN; i++) {
    const a = Math.random() * 6.283, s = 3 + Math.random() * 6;
    pPos.set([x, y, 0], i * 3); pVel.set([Math.cos(a) * s, Math.abs(Math.sin(a)) * s + 2, (Math.random() - .5) * 6], i * 3); pLife[i] = 1;
  }
}
function stepParticles(dt) {
  for (let i = 0; i < PN; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt * 1.4;
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = -100; continue; }
    pVel[i * 3 + 1] -= 9 * dt;
    for (let k = 0; k < 3; k++) pPos[i * 3 + k] += pVel[i * 3 + k] * dt;
  }
  pGeo.attributes.position.needsUpdate = true;
}

/* ═════ Buraco ═════ */
const hole = new THREE.Group(); scene.add(hole);
const dark = (r, o) => new THREE.MeshBasicMaterial({ color: 0x02040a, transparent: true, opacity: o });
const hf = new THREE.Mesh(new THREE.CircleGeometry(CFG.holeR, 36), dark(0, .95)); hf.rotation.x = -Math.PI / 2; hf.position.y = .04; hole.add(hf);
const hw = new THREE.Mesh(new THREE.CylinderGeometry(CFG.holeR, CFG.holeR, .4, 36, 1, true), new THREE.MeshBasicMaterial({ color: 0x050912, side: THREE.BackSide })); hw.position.y = -.18; hole.add(hw);
const rimMat = new THREE.MeshStandardMaterial({ color: 0x30e3ca, emissive: 0x11a08c, emissiveIntensity: 1.3, metalness: .6, roughness: .28 });
const rim = new THREE.Mesh(new THREE.TorusGeometry(CFG.holeR, .11, 12, 48), rimMat); rim.rotation.x = -Math.PI / 2; rim.position.y = .08; hole.add(rim);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.055, .055, 3, 8), mMetal); pole.castShadow = true; pole.position.set(CFG.holeR + .35, 1.5, 0); hole.add(pole);
const flag = new THREE.Mesh(new THREE.PlaneGeometry(.95, .6), new THREE.MeshBasicMaterial({ color: 0xff6b9d, side: THREE.DoubleSide })); flag.position.set(CFG.holeR + .85, 2.55, 0); hole.add(flag);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.9, .9, 14, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0x30e3ca, transparent: true, opacity: .1, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
beam.position.y = 7; hole.add(beam);

/* ═════ Barreiras ═════ */
const barMat = new THREE.MeshStandardMaterial({ color: 0x2a1b3d, metalness: .6, roughness: .35, emissive: 0x3a0a28, emissiveIntensity: .6 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0xff4d8d });
const barGroup = new THREE.Group(); scene.add(barGroup);
let barriers = [];
function clearBarriers() {
  for (const o of [...barGroup.children]) { barGroup.remove(o); o.geometry.dispose(); o.children.forEach(c => c.geometry.dispose()); }
  barriers = [];
}
function addBarrier(x, y0, y1) {
  const h = y1 - y0, g = new THREE.BoxGeometry(.9, h, 5), m = new THREE.Mesh(g, barMat);
  m.position.set(x, y0 + h / 2, 0); m.castShadow = true; m.receiveShadow = true;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), edgeMat));
  barGroup.add(m); barriers.push({ x, y0, y1 });
}
function genBarriers() {
  clearBarriers();
  const n = Math.min(1 + Math.floor(S.score / 2), 3);
  const x0 = 4.5, x1 = S.targetX - 2.5, seg = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + seg * i + 0.8 + Math.random() * Math.max(seg - 1.6, 0.1);
    if (S.score >= 2 && i === n - 1 && Math.random() < .45) addBarrier(x, 5.5 + Math.random() * 2, 20);
    else addBarrier(x, 0, 1.6 + Math.random() * Math.min(1.8 + S.score * .25, 3.2));
  }
  $('nbar').textContent = n;
}

function placeTarget(x) { S.targetX = x; hole.position.set(x, 0, 0); $('tgt').textContent = nf(x, 1) + ' m'; }
function spawnTarget() { placeTarget(Math.round((9 + Math.random() * 15) * 2) / 2); genBarriers(); }

/* Vértice */
const vMarker = new THREE.Mesh(new THREE.SphereGeometry(.23, 14, 10), new THREE.MeshBasicMaterial({ color: 0xff2f7a }));
const vGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const vLine = new THREE.Line(vGeo, new THREE.LineDashedMaterial({ color: 0xff2f7a, dashSize: .32, gapSize: .26 }));
vLine.frustumCulled = false; scene.add(vMarker, vLine);
function updateHelpers() {
  const { a, b, c } = S, ok = Math.abs(a) > 1e-6;
  vMarker.visible = vLine.visible = ok;
  if (!ok) return;
  const xv = -b / (2 * a), yv = c - b * b / (4 * a), p = vGeo.attributes.position;
  vMarker.position.set(xv, yv, 0);
  p.setXYZ(0, xv, 0, 0); p.setXYZ(1, xv, Math.max(yv, 0), 0); p.needsUpdate = true;
  vGeo.computeBoundingSphere(); vLine.computeLineDistances();
}

/* ═════ HUD ═════ */
function updateHUD() {
  const { a, b, c } = S, d = b * b - 4 * a * c;
  $('eq').textContent = `y = ${a < 0 ? '−' : ''}${nf(Math.abs(a), 3)}x² ${b < 0 ? '−' : '+'} ${nf(Math.abs(b))}x ${c < 0 ? '−' : '+'} ${nf(Math.abs(c))}`;
  $('delta').textContent = nf(d);
  if (Math.abs(a) < 1e-9) { $('vertex').textContent = 'não existe (a = 0)'; $('roots').textContent = 'função do 1º grau'; $('ymax').textContent = '—'; }
  else {
    const xv = -b / (2 * a), yv = c - b * b / (4 * a);
    $('vertex').textContent = `(${nf(xv)}, ${nf(yv)})`; $('ymax').textContent = nf(yv) + ' m';
    if (d < 0) $('roots').textContent = 'nenhuma real (Δ < 0)';
    else { const q = Math.sqrt(d); $('roots').textContent = `x₁=${nf((-b - q) / (2 * a))} · x₂=${nf((-b + q) / (2 * a))}`; }
  }
  const cv = $('concav');
  if (a < -1e-6) { cv.className = 'ok'; cv.textContent = 'Concavidade para baixo (a < 0) ✔'; }
  else if (a > 1e-6) { cv.className = 'bad'; cv.textContent = 'Concavidade para cima (a > 0) ✘'; }
  else { cv.className = 'bad'; cv.textContent = 'a = 0 → reta, não parábola.'; }
  $('score').textContent = S.score; $('attempts').textContent = S.attempts;
}
let toastT;
function toast(html, kind) {
  const el = $('toast'); el.innerHTML = html; el.className = 'show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => el.className = '', 3400);
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ═════ UI ═════ */
const sl = { a: $('sA'), b: $('sB'), c: $('sC') };
function onParams() {
  $('vA').textContent = (S.a < 0 ? '−' : '') + nf(Math.abs(S.a), 3);
  $('vB').textContent = nf(S.b); $('vC').textContent = nf(S.c);
  updateHelpers(); updateHUD(); updateLauncher();
  if (S.phase === 'aim') ball.position.set(0, S.c, 0);
}
for (const k of ['a', 'b', 'c']) sl[k].addEventListener('input', () => { S[k] = parseFloat(sl[k].value); onParams(); });
function setPhase(p) { S.phase = p; const l = p !== 'aim'; Object.values(sl).forEach(s => s.disabled = l); $('btnLaunch').disabled = l; }

/* ═════ Jogo ═════ */
let flash = 0;
function launch() {
  if (S.phase !== 'aim') return;
  clearTrail(); S.t = 0; S.sinkT = 0; S.attempts++;
  ball.visible = true; ball.scale.setScalar(1); ball.position.set(0, S.c, 0);
  pushTrail(0, S.c); setPhase('flying'); updateHUD(); vib(30);
}
function stepFlight(dt) {
  S.t += dt;
  const x = CFG.speedX * S.t, y = f(x);
  ball.position.set(x, y, 0); pushTrail(x, y);

  const r = CFG.ballR * .75;
  for (const b of barriers) {
    if (x + r > b.x - .45 && x - r < b.x + .45 && y + r > b.y0 && y - r < b.y1) {
      burst(x, y, 0xff4d8d); ball.visible = false;
      toast(`🧱 <b>Bateu na barreira</b> em x = ${nf(b.x, 1)} m.<br>Mude a altura da parábola nesse ponto.`, 'bad');
      vib([30, 20, 30]); return endFlight(false, x, true);
    }
  }
  if (y <= 0 && x > .5) {
    ball.position.y = 0; pushTrail(x, 0);
    if (Math.abs(x - S.targetX) <= CFG.holeR) {
      S.score++; flash = 1; ball.position.set(S.targetX, 0, 0); setPhase('sinking'); S.sinkT = 0;
      burst(S.targetX, .5, 0x30e3ca);
      toast(`🎯 <b>Na mosca!</b> A raiz positiva em x = ${nf(S.targetX)} m<br>caiu dentro do buraco. <b>Δ = ${nf(S.b * S.b - 4 * S.a * S.c)}</b>`, 'ok');
      vib([40, 30, 60]); updateHUD();
    } else endFlight(false, x);
    return;
  }
  if (x > CFG.maxX) endFlight(false, x);
}
function endFlight(hit, lx, crashed) {
  setPhase('done');
  if (!hit && !crashed) {
    let m;
    if (lx >= CFG.maxX - .5) m = '❌ <b>A bolinha saiu do campo.</b><br>Aumente <b>b</b> ou diminua |a|.';
    else {
      const d = Math.abs(lx - S.targetX);
      m = `❌ <b>Caiu em x = ${nf(lx)} m</b>, ${nf(d)} m ${lx < S.targetX ? 'antes' : 'depois'} do buraco.<br>` +
        (lx < S.targetX ? 'Aumente <b>b</b> ou diminua |a|.' : 'Diminua <b>b</b> ou aumente |a|.');
    }
    toast(m, 'bad'); vib(20);
  }
  updateHUD();
  setTimeout(() => { if (S.phase !== 'done') return; if (hit) spawnTarget(); resetShot(); }, hit ? 700 : 1300);
}
function stepSink(dt) {
  S.sinkT += dt; ball.position.y = -S.sinkT * 5; ball.scale.setScalar(Math.max(.15, 1 - S.sinkT * 1.6));
  if (S.sinkT > .55) { ball.visible = false; endFlight(true); }
}
function resetShot() {
  setPhase('aim'); S.t = 0; S.sinkT = 0; ball.visible = true; ball.scale.setScalar(1);
  ball.position.set(0, S.c, 0); updateLauncher(); updateHUD();
}
function fullReset() { S.score = 0; S.attempts = 0; clearTrail(); spawnTarget(); resetShot(); $('toast').className = ''; }

$('btnLaunch').addEventListener('click', launch);
$('btnReset').addEventListener('click', fullReset);
$('btnTarget').addEventListener('click', () => { if (S.phase === 'aim') spawnTarget(); });
$('btnMath').addEventListener('click', () => $('math').classList.toggle('show'));
document.addEventListener('touchstart', e => {
  const m = $('math');
  if (mq() && m.classList.contains('show') && !m.contains(e.target) && !$('btnMath').contains(e.target)) m.classList.remove('show');
}, { passive: true });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); launch(); }
  else if (e.key === 'r' || e.key === 'R') fullReset();
  else if (e.key === 'm' || e.key === 'M') $('math').classList.toggle('show');
});

let rT;
function onResize() {
  clearTimeout(rT);
  rT = setTimeout(() => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (modeKey() !== camMode) adjustCamera();
  }, 120);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);

/* ═════ Loop ═════ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (document.hidden) { clock.getDelta(); return; }
  const dt = Math.min(clock.getDelta(), .05), et = clock.elapsedTime;
  if (S.phase === 'flying') stepFlight(dt);
  else if (S.phase === 'sinking') stepSink(dt);
  stepParticles(dt);

  let s = 1 + Math.sin(et * 3) * .03;
  if (flash > 0) { flash = Math.max(0, flash - dt * 1.6); s += flash * .45; rimMat.emissiveIntensity = 1.3 + flash * 5; }
  else rimMat.emissiveIntensity = 1.3;
  hole.scale.setScalar(s); hole.rotation.y = et * .15;
  beam.material.opacity = .08 + Math.sin(et * 2) * .03;
  flag.rotation.y = Math.sin(et * 4) * .35;
  if (S.phase === 'aim') ball.scale.setScalar(1 + Math.sin(et * 4) * .08);
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 110) c.position.x = -110; }

  controls.update();
  renderer.render(scene, camera);
}

placeTarget(15); genBarriers(); onParams(); resetShot(); animate();
const ld = $('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 450);
</script>
</body>
</html>
